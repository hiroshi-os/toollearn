name: tests
on: [push, pull_request]
jobs:
  standard-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m toollearn.cli demo
  cpu-learning-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[train]'
      - run: python -m unittest discover -s tests -v
      - run: python -m toollearn.cli smoke --output artifacts/smoke
      - run: python tests/integration_hf.py --output artifacts/integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-learning-evidence
          path: artifacts/
