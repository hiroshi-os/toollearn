[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toollearn"
version = "0.1.0"
description = "Reproducible small-model tool-use adaptation experiments"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.57,<5", "peft>=0.14", "accelerate>=1"]
test = ["pytest>=8"]

[project.scripts]
toollearn = "toollearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
